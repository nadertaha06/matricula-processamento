name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: nadertaha06/matricula-processamento

jobs:
  test:
    name: Testes e cobertura (minimo 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: processamento_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: tests
          RABBITMQ_DEFAULT_PASS: tests
          RABBITMQ_DEFAULT_VHOST: etapa2-tests
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: processamento_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_URL: amqp://tests:tests@localhost:5672/etapa2-tests
      WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Testes unitarios e integracao real com cobertura de linhas e branches
        run: python -m pytest
      - name: Resumo da cobertura medida
        if: always()
        run: python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar HTML XML JSON e JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-processamento-${{ github.sha }}
          retention-days: 30
          path: |
            coverage/
            coverage.xml
            coverage.json
            reports/junit.xml

  deploy:
    name: DockerHub e EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: nadertaha06
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publicar imagem imutavel do commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Preparar SSH
        env:
          DEPLOY_KEY: ${{ secrets.KEY_TEST }}
          DEPLOY_HOST: ${{ secrets.HOST_TEST }}
          HOST_PUBLIC_KEY: ${{ vars.EC2_HOST_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$HOST_PUBLIC_KEY"
          printf '%s %s\n' "$DEPLOY_HOST" "$HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
      - name: Atualizar container e verificar readiness (rollback em falha)
        env:
          DEPLOY_HOST: ${{ secrets.HOST_TEST }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" bash -s -- "$IMAGE_TAG" < scripts/deploy.sh
